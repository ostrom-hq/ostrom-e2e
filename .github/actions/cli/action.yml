name: Ostrom CLI (real native binary)
description: >
  Builds the native linuxX64 `ostrom` binary of ostrom-cli at a given ref (cached by commit) and puts it on PATH.
  Contract: ostrom-cli has `ci/build-linux.sh` that leaves `dist/ostrom`.
inputs:
  deploy-key:
    description: Read-only deploy key of ostrom-cli (org secret DEPLOY_KEY_CLI). Empty when called from ostrom-cli itself.
    required: false
    default: ""
  ref:
    description: Ref of ostrom-cli to build (ignored when `path` is given).
    required: false
    default: main
  core-key:
    description: >
      Read-only deploy key of ostrom-core (org secret DEPLOY_KEY_CORE). When the sources pin ostrom-core in
      `gradle/ostrom-core.ref`, core is checked out at that commit and built with them (`ostrom.core.local`): a
      GITHUB_TOKEN never reads another repository's Maven packages (JOURNAL 05:50).
    required: false
    default: ""
  path:
    description: Path of an ostrom-cli checkout already on the runner (ostrom-cli's own CI).
    required: false
    default: ""
  required:
    description: "false: when the repository does not meet the contract yet, set `available` to false instead of failing (the bench marks its scenarios blocked)."
    required: false
    default: "true"
outputs:
  available:
    description: "true when the binary was built (or restored) and, for the server, is running."
    value: ${{ steps.path.outputs.ok == 'true' && 'true' || 'false' }}
  bin:
    description: Path of the `ostrom` binary.
    value: ${{ steps.src.outputs.bin }}
  sha:
    description: Commit of ostrom-cli that was built.
    value: ${{ steps.src.outputs.sha }}
runs:
  using: composite
  steps:
    - name: Checkout ostrom-cli
      if: inputs.path == ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ostrom-hq/ostrom-cli
        ref: ${{ inputs.ref }}
        ssh-key: ${{ inputs.deploy-key }}
        path: .ostrom/cli
    - name: Locate sources
      id: src
      shell: bash
      run: |
        dir="${{ inputs.path }}"; [ -n "$dir" ] || dir=.ostrom/cli
        dir="$(cd "$dir" && pwd)"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "sha=$(git -C "$dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "bin=$RUNNER_TEMP/ostrom-cli-bin/ostrom" >> "$GITHUB_OUTPUT"
        if [ ! -x "$dir/ci/build-linux.sh" ]; then
          echo "::${{ inputs.required == 'true' && 'error' || 'warning' }} title=ostrom-cli contract::ostrom-cli@$(git -C "$dir" rev-parse --short HEAD) has no executable ci/build-linux.sh yet (contract in ostrom-e2e/templates/README.md)"
          if [ "${{ inputs.required }}" = "true" ]; then exit 1; fi
          echo "available=false" >> "$GITHUB_OUTPUT"
        else
          echo "available=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Cache the CLI binary by commit
      if: steps.src.outputs.available == 'true'
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ostrom-cli-bin/ostrom
        key: ostrom-cli-linuxX64-${{ steps.src.outputs.sha }}
    - name: ostrom-core version (gradle/ostrom-core.ref)
      id: core
      if: inputs.core-key != '' && steps.src.outputs.available == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DIR: ${{ steps.src.outputs.dir }}
      run: |
        if [ -f "$DIR/gradle/ostrom-core.ref" ]; then echo "ref=$(tr -d '[:space:]' < "$DIR/gradle/ostrom-core.ref")" >> "$GITHUB_OUTPUT"; fi
    - name: Checkout ostrom-core at that commit
      if: steps.core.outputs.ref != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ostrom-hq/ostrom-core
        ref: ${{ steps.core.outputs.ref }}
        ssh-key: ${{ inputs.core-key }}
        path: .ostrom/core-cli
        persist-credentials: false
    - name: Build ostrom-core with the sources (ostrom.core.local)
      if: steps.core.outputs.ref != ''
      shell: bash
      env:
        DIR: ${{ steps.src.outputs.dir }}
      run: |
        # settings.gradle.kts includes ../ostrom-core next to the sources; the server and the CLI may pin different
        # commits, so each build puts its own there.
        rm -rf "$DIR/../ostrom-core"
        mv .ostrom/core-cli "$DIR/../ostrom-core"
        mkdir -p ~/.gradle
        grep -qx 'ostrom.core.local=true' ~/.gradle/gradle.properties 2>/dev/null || echo "ostrom.core.local=true" >> ~/.gradle/gradle.properties
    - name: Set up Java (build only)
      if: steps.src.outputs.available == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with: { distribution: temurin, java-version: 21 }
    - name: Set up Gradle (build only)
      if: steps.src.outputs.available == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        build-root-directory: ${{ steps.src.outputs.dir }}
    - name: Cache ~/.konan (build only)
      if: steps.src.outputs.available == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-cli-${{ hashFiles('.ostrom/cli/gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-
    - name: Build the native CLI
      id: build
      if: steps.src.outputs.available == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ steps.src.outputs.dir }}
      env:
        LEVEL: ${{ inputs.required == 'true' && 'error' || 'warning' }}
        REQUIRED: ${{ inputs.required }}
      run: |
        mkdir -p "$RUNNER_TEMP/ostrom-cli-bin"
        # Free the runner's memory for what comes next (the other native build, the server, the scenarios): the
        # Gradle and Kotlin daemons of this build stay up otherwise, and two native links at once exhaust the runner
        # (runs 41031154110 #1 and #2 cancelled during the CLI's link). Only this job's own daemons run here.
        stop_daemons() { ./gradlew --stop >/dev/null 2>&1 || true; pkill -f 'KotlinCompileDaemon' || true; }
        df -h / | tail -1; free -m | sed -n 2p
        if ./ci/build-linux.sh && [ -f dist/ostrom ]; then
          stop_daemons
          cp dist/ostrom "$RUNNER_TEMP/ostrom-cli-bin/ostrom"; echo "built=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        echo "::$LEVEL title=ostrom-cli contract::ci/build-linux.sh failed or did not leave dist/ostrom"
        echo "built=false" >> "$GITHUB_OUTPUT"
        [ "$REQUIRED" = "true" ] && exit 1 || exit 0
    - name: Put ostrom on PATH
      id: path
      if: steps.src.outputs.available == 'true' && steps.build.outputs.built != 'false'
      shell: bash
      run: |
        echo "ok=true" >> "$GITHUB_OUTPUT"
        chmod +x "${{ steps.src.outputs.bin }}"
        echo "$RUNNER_TEMP/ostrom-cli-bin" >> "$GITHUB_PATH"
        "${{ steps.src.outputs.bin }}" --version || true
