name: Ostrom server (real native binary)
description: >
  Builds the native linuxX64 binary of ostrom-server at a given ref (cached by commit), starts it against the given
  PostgreSQL and waits for GET /health. Used by the CI of ostrom-web, ostrom-app, ostrom-cli and ostrom-e2e.
  With `image: "true"`, runs the server's own distroless image instead (its Dockerfile at that ref, around the same
  binary), in a container named `ostrom-e2e-server` on the host network: what the bench tests is what ships.
  Contract (ostrom-e2e/templates/README.md): the binary comes from `ci/build-linux.sh` (→ `dist/ostrom-server`) when
  the repository has it, else from `./gradlew :app:linkReleaseExecutableLinuxX64`; it reads OSTROM_DATABASE_URL,
  OSTROM_DATABASE_USER, OSTROM_DATABASE_PASSWORD and OSTROM_PORT, applies its migrations at start and answers
  GET /health.
inputs:
  deploy-key:
    description: Read-only deploy key of ostrom-server (org secret DEPLOY_KEY_SERVER). Empty when called from ostrom-server itself.
    required: false
    default: ""
  ref:
    description: Ref of ostrom-server to build (ignored when `path` is given).
    required: false
    default: main
  core-key:
    description: >
      Read-only deploy key of ostrom-core (org secret DEPLOY_KEY_CORE). When the sources pin ostrom-core in
      `gradle/ostrom-core.ref`, core is checked out at that commit and built with them (`ostrom.core.local`): a
      GITHUB_TOKEN never reads another repository's Maven packages (JOURNAL 05:50).
    required: false
    default: ""
  path:
    description: Path of an ostrom-server checkout already on the runner (ostrom-server's own CI).
    required: false
    default: ""
  database-url:
    description: PostgreSQL URL for the server (postgresql://host:port/db).
    required: true
  database-admin-url:
    description: >
      A superuser URL of the same PostgreSQL (postgresql://user:password@host:port/postgres). When the sources have
      `ci/database-roles.sql`, the roles are created as deployed (docs/tenancy.md): `ostrom_owner` migrates the
      database (`ostrom-server migrate`) and the server serves as `ostrom_app`, which owns nothing and cannot bypass
      row-level security (the server refuses a role that can, S2-01). The database of `database-url` must not exist.
    required: false
    default: ""
  database-user:
    description: PostgreSQL user.
    required: false
    default: ostrom
  database-password:
    description: PostgreSQL password.
    required: false
    default: ostrom
  port:
    description: Port to listen on.
    required: false
    default: "4600"
  extra-env:
    description: Extra environment lines (KEY=value, one per line) passed to the server.
    required: false
    default: ""
  image:
    description: '"true": build the Docker image of ostrom-server (its Dockerfile) and run it, instead of the bare binary.'
    required: false
    default: "false"
  docker-args:
    description: Extra arguments of `docker run` in image mode (volumes, for instance the sign-in mail directory).
    required: false
    default: ""
  required:
    description: "false: when the repository does not meet the contract yet, set `available` to false instead of failing (the bench marks its scenarios blocked)."
    required: false
    default: "true"
outputs:
  available:
    description: "true when the binary was built (or restored) and, for the server, is running."
    value: ${{ steps.start.outputs.up == 'true' && 'true' || 'false' }}
  url:
    description: Base URL of the running server.
    value: http://127.0.0.1:${{ inputs.port }}
  port:
    description: Port of the running server.
    value: ${{ inputs.port }}
  sha:
    description: Commit of ostrom-server that runs.
    value: ${{ steps.src.outputs.sha }}
  bin:
    description: Path of the server binary.
    value: ${{ steps.src.outputs.bin }}
  mode:
    description: "`image` (the server's Docker image, container `ostrom-e2e-server`) or `binary`."
    value: ${{ inputs.image == 'true' && 'image' || 'binary' }}
runs:
  using: composite
  steps:
    - name: Checkout ostrom-server
      if: inputs.path == ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ostrom-hq/ostrom-server
        ref: ${{ inputs.ref }}
        ssh-key: ${{ inputs.deploy-key }}
        path: .ostrom/server
    - name: Locate sources
      id: src
      shell: bash
      run: |
        dir="${{ inputs.path }}"; [ -n "$dir" ] || dir=.ostrom/server
        dir="$(cd "$dir" && pwd)"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "sha=$(git -C "$dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "bin=$RUNNER_TEMP/ostrom-bin/ostrom-server" >> "$GITHUB_OUTPUT"
        if [ ! -x "$dir/ci/build-linux.sh" ] && [ ! -f "$dir/app/build.gradle.kts" ]; then
          echo "::${{ inputs.required == 'true' && 'error' || 'warning' }} title=ostrom-server contract::ostrom-server@$(git -C "$dir" rev-parse --short HEAD) has neither ci/build-linux.sh nor the :app module yet (contract in ostrom-e2e/templates/README.md)"
          if [ "${{ inputs.required }}" = "true" ]; then exit 1; fi
          echo "available=false" >> "$GITHUB_OUTPUT"
        else
          echo "available=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Cache the server binary by commit
      if: steps.src.outputs.available == 'true'
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ostrom-bin/ostrom-server
        key: ostrom-server-linuxX64-${{ steps.src.outputs.sha }}
    - name: ostrom-core version (gradle/ostrom-core.ref)
      id: core
      if: inputs.core-key != '' && steps.src.outputs.available == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DIR: ${{ steps.src.outputs.dir }}
      run: |
        if [ -f "$DIR/gradle/ostrom-core.ref" ]; then echo "ref=$(tr -d '[:space:]' < "$DIR/gradle/ostrom-core.ref")" >> "$GITHUB_OUTPUT"; fi
    - name: Checkout ostrom-core at that commit
      if: steps.core.outputs.ref != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ostrom-hq/ostrom-core
        ref: ${{ steps.core.outputs.ref }}
        ssh-key: ${{ inputs.core-key }}
        path: .ostrom/core-server
        persist-credentials: false
    - name: Build ostrom-core with the sources (ostrom.core.local)
      if: steps.core.outputs.ref != ''
      shell: bash
      env:
        DIR: ${{ steps.src.outputs.dir }}
      run: |
        # settings.gradle.kts includes ../ostrom-core next to the sources; the server and the CLI may pin different
        # commits, so each build puts its own there.
        rm -rf "$DIR/../ostrom-core"
        mv .ostrom/core-server "$DIR/../ostrom-core"
        mkdir -p ~/.gradle
        grep -qx 'ostrom.core.local=true' ~/.gradle/gradle.properties 2>/dev/null || echo "ostrom.core.local=true" >> ~/.gradle/gradle.properties
    - name: Set up Java (build only)
      if: steps.src.outputs.available == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with: { distribution: temurin, java-version: 21 }
    - name: Set up Gradle (build only)
      if: steps.src.outputs.available == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        build-root-directory: ${{ steps.src.outputs.dir }}
    - name: Cache ~/.konan (build only)
      if: steps.src.outputs.available == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-server-${{ hashFiles('.ostrom/server/gradle/libs.versions.toml') }}
        restore-keys: konan-${{ runner.os }}-
    - name: Build the native server
      id: build
      if: steps.src.outputs.available == 'true' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ steps.src.outputs.dir }}
      env:
        LEVEL: ${{ inputs.required == 'true' && 'error' || 'warning' }}
        REQUIRED: ${{ inputs.required }}
      run: |
        mkdir -p "$RUNNER_TEMP/ostrom-bin"
        if [ -x ci/build-linux.sh ]; then
          out=dist/ostrom-server; ./ci/build-linux.sh && ok=1 || ok=0
        else
          out=app/build/bin/linuxX64/releaseExecutable/ostrom-server.kexe; ./gradlew --no-daemon :app:linkReleaseExecutableLinuxX64 && ok=1 || ok=0
        fi
        if [ "$ok" = 1 ] && [ -f "$out" ]; then
          cp "$out" "$RUNNER_TEMP/ostrom-bin/ostrom-server"; echo "built=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        echo "::$LEVEL title=ostrom-server contract::the build failed or did not produce $out (contract in ostrom-e2e/templates/README.md)"
        echo "built=false" >> "$GITHUB_OUTPUT"
        [ "$REQUIRED" = "true" ] && exit 1 || exit 0
    - name: Build the server image (its own Dockerfile, around the same binary)
      id: image
      if: inputs.image == 'true' && steps.src.outputs.available == 'true' && steps.build.outputs.built != 'false'
      shell: bash
      working-directory: ${{ steps.src.outputs.dir }}
      env:
        LEVEL: ${{ inputs.required == 'true' && 'error' || 'warning' }}
        REQUIRED: ${{ inputs.required }}
      run: |
        mkdir -p dist && cp "${{ steps.src.outputs.bin }}" dist/ostrom-server && chmod 755 dist/ostrom-server
        if [ -f Dockerfile ] && docker build -q -t ostrom-server:e2e .; then
          docker images ostrom-server:e2e --format 'image ostrom-server:e2e {{.Size}}'
          echo "built=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        echo "::$LEVEL title=ostrom-server image::no Dockerfile, or docker build failed"
        echo "built=false" >> "$GITHUB_OUTPUT"
        [ "$REQUIRED" = "true" ] && exit 1 || exit 0
    - name: Database roles and migrations, as deployed (ci/database-roles.sql)
      id: db
      if: inputs.database-admin-url != '' && steps.src.outputs.available == 'true' && steps.build.outputs.built != 'false' && steps.image.outputs.built != 'false'
      shell: bash
      env:
        DIR: ${{ steps.src.outputs.dir }}
        ADMIN_URL: ${{ inputs.database-admin-url }}
        DATABASE_URL: ${{ inputs.database-url }}
        IMAGE: ${{ inputs.image }}
        BIN: ${{ steps.src.outputs.bin }}
      run: |
        if [ ! -f "$DIR/ci/database-roles.sql" ]; then echo "no ci/database-roles.sql: the server serves as the given user"; exit 0; fi
        # psql of the same PostgreSQL image as the service, on the host network: nothing installed on the runner.
        docker run --rm -i --network host postgres:18 psql "$ADMIN_URL" -v ON_ERROR_STOP=1 < "$DIR/ci/database-roles.sql"
        # postgresql://host:port/db → the owner's URL for `migrate`.
        owner="postgresql://ostrom_owner:ostrom_owner@${DATABASE_URL#postgresql://}"
        if [ "$IMAGE" = "true" ]; then
          docker run --rm --network host -e OSTROM_DATABASE_MIGRATION_URL="$owner" ostrom-server:e2e migrate
        else
          chmod +x "$BIN"; OSTROM_DATABASE_MIGRATION_URL="$owner" "$BIN" migrate
        fi
        echo "roles=true" >> "$GITHUB_OUTPUT"
    - name: Start the server and wait for /health
      id: start
      if: steps.src.outputs.available == 'true' && steps.build.outputs.built != 'false' && steps.image.outputs.built != 'false'
      shell: bash
      env:
        OSTROM_DATABASE_URL: ${{ inputs.database-url }}
        OSTROM_DATABASE_USER: ${{ steps.db.outputs.roles == 'true' && 'ostrom_app' || inputs.database-user }}
        OSTROM_DATABASE_PASSWORD: ${{ steps.db.outputs.roles == 'true' && 'ostrom_app' || inputs.database-password }}
        OSTROM_PORT: ${{ inputs.port }}
        KEY_FILE: ${{ runner.temp }}/ostrom-instance-key-${{ inputs.port }}.pem
        EXTRA_ENV: ${{ inputs.extra-env }}
        IMAGE: ${{ inputs.image }}
        DOCKER_ARGS: ${{ inputs.docker-args }}
        LEVEL: ${{ inputs.required == 'true' && 'error' || 'warning' }}
        REQUIRED: ${{ inputs.required }}
      run: |
        if [ "$IMAGE" = "true" ]; then
          # The image keeps its own signing key path (/var/lib/ostrom, owned by its non-root user).
          printf '%s\n' "$EXTRA_ENV" | grep -v '^$' > "$RUNNER_TEMP/ostrom-server.env" || true
          # shellcheck disable=SC2086 # DOCKER_ARGS is a list of arguments
          docker run -d --name ostrom-e2e-server --network host --env-file "$RUNNER_TEMP/ostrom-server.env" $DOCKER_ARGS \
            -e OSTROM_DATABASE_URL -e OSTROM_DATABASE_USER -e OSTROM_DATABASE_PASSWORD -e OSTROM_PORT ostrom-server:e2e
          alive() { [ "$(docker inspect -f '{{.State.Running}}' ostrom-e2e-server 2>/dev/null)" = "true" ]; }
          logs() { docker logs ostrom-e2e-server 2>&1; }
        else
          export OSTROM_SIGNING_KEY_FILE="$KEY_FILE"
          set -a; [ -n "$EXTRA_ENV" ] && eval "$(printf '%s\n' "$EXTRA_ENV" | sed 's/^/export /')"; set +a
          chmod +x "${{ steps.src.outputs.bin }}"
          nohup "${{ steps.src.outputs.bin }}" > "$RUNNER_TEMP/ostrom-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ostrom-server.pid"
          alive() { kill -0 "$(cat "$RUNNER_TEMP/ostrom-server.pid")" 2>/dev/null; }
          logs() { cat "$RUNNER_TEMP/ostrom-server.log"; }
        fi
        for i in $(seq 1 120); do
          if curl -fsS "http://127.0.0.1:${OSTROM_PORT}/health" >/dev/null 2>&1; then echo "server up after ${i}×0.5 s"; echo "up=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! alive; then break; fi
          sleep 0.5
        done
        echo "::$LEVEL title=ostrom-server::did not answer /health within 60 s"; logs
        [ "$REQUIRED" = "true" ] && exit 1 || exit 0
