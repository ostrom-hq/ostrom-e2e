# zizmor configuration (https://docs.zizmor.sh/configuration/). Every exception is temporary and listed, with its
# owner, in ostrom-core/docs/OPEN-SOURCE.md ("Exceptions to close before going public"): none survives the launch.
rules:
  # The composite actions (.github/actions/*/action.yml, QA) expand inputs inside run: blocks.
  template-injection:
    ignore:
      - action.yml
  # ci.yml (QA) caches dependencies in a workflow that also runs on release tags.
  cache-poisoning:
    ignore:
      - ci.yml
