# Nightly: the long k6 test (soak + ramp) and the 100-yes race against the server image of ostrom-server main.
name: Nightly
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  load-soak:
    name: load-soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      stripe-mock:
        image: stripe/stripe-mock@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78 # latest, 2026-10-01 (as ostrom-server)
        ports: ["12111:12111"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - name: Sign-in mail directory (written by the server's non-root user, read by the scenarios)
        run: mkdir -p "$RUNNER_TEMP/ostrom-mail" && chmod 0777 "$RUNNER_TEMP/ostrom-mail"
      - name: Real Ostrom server (image of ostrom-server main)
        id: server
        uses: ./.github/actions/server
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY_SERVER }}
          core-key: ${{ secrets.DEPLOY_KEY_CORE }}
          database-url: postgresql://localhost:5432/ostrom
          # The superuser of the service only creates the roles; the server migrates as ostrom_owner, serves as ostrom_app.
          database-admin-url: postgresql://postgres:postgres@localhost:5432/postgres
          image: "true"
          # Test values of the bench, never real ones: stripe-mock behind billing, sign-in mails written to a directory.
          extra-env: |
            OSTROM_STRIPE_SECRET_KEY=sk_test_e2e
            OSTROM_STRIPE_WEBHOOK_SECRET=whsec_e2e_bench
            OSTROM_STRIPE_API_BASE=http://127.0.0.1:12111
            OSTROM_MAIL_DIR=/var/lib/ostrom/mail
            OSTROM_PUBLIC_URL=http://127.0.0.1:4600
            OSTROM_CONSOLE_URL=http://127.0.0.1:4600
            OSTROM_TRUSTED_PROXIES=127.0.0.1/32
            OSTROM_GITHUB_WEB_URL=http://127.0.0.1:4610
            OSTROM_GITHUB_API_URL=http://127.0.0.1:4610
            OSTROM_GITHUB_CLIENT_ID=Iv1.e2ebench
            OSTROM_GITHUB_CLIENT_SECRET=e2e-bench-fake-github
          docker-args: -v ${{ runner.temp }}/ostrom-mail:/var/lib/ostrom/mail
          required: "true"
      - name: Gate load setup (requester token, approver session)
        id: loadsetup
        if: steps.server.outputs.available == 'true'
        env:
          OSTROM_E2E_SERVER_URL: ${{ steps.server.outputs.url }}
          OSTROM_E2E_MAIL_DIR: ${{ runner.temp }}/ostrom-mail
        run: node scripts/load-setup.ts
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        if: steps.server.outputs.available == 'true'
      - name: k6 soak (25 min) and ramp
        if: steps.server.outputs.available == 'true'
        env:
          OSTROM_URL: ${{ steps.server.outputs.url }}
          OSTROM_LOAD_SCENARIOS: ${{ steps.loadsetup.outputs.ready == 'true' && 'health,asks,gates' || 'health' }}
        run: k6 run --summary-export soak-summary.json load/soak.js
      - name: k6 race (100 simultaneous yes)
        # Runs as soon as scripts/load-setup.ts could make the requester token and the approver session.
        if: steps.loadsetup.outputs.ready == 'true'
        env:
          OSTROM_URL: ${{ steps.server.outputs.url }}
        run: k6 run --summary-export race-summary.json load/race.js
      - name: No server yet
        if: steps.server.outputs.available != 'true'
        run: echo "ostrom-server does not meet the bench contract yet; load tests are blocked (RAPPORT.md)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: k6-nightly
          path: "*-summary.json"
          if-no-files-found: ignore
