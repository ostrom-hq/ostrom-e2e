# Nightly: the long k6 test (soak + ramp) and the 100-yes race against the server built from ostrom-server main.
name: Nightly
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  load-soak:
    name: load-soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: ostrom, POSTGRES_PASSWORD: ostrom, POSTGRES_DB: ostrom }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ostrom -d ostrom" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Real Ostrom server
        id: server
        uses: ./.github/actions/server
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY_SERVER }}
          database-url: postgresql://localhost:5432/ostrom
          required: "false"
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        if: steps.server.outputs.available == 'true'
      - name: k6 soak (25 min) and ramp
        if: steps.server.outputs.available == 'true'
        env:
          OSTROM_URL: ${{ steps.server.outputs.url }}
          OSTROM_LOAD_SCENARIOS: ${{ vars.OSTROM_LOAD_GATES == 'true' && 'health,asks,gates' || 'health' }}
        run: k6 run --summary-export soak-summary.json load/soak.js
      - name: k6 race (100 simultaneous yes)
        # Org variable OSTROM_LOAD_GATES, set to true by QA once the gate routes and the two tokens are on main.
        if: vars.OSTROM_LOAD_GATES == 'true' && steps.server.outputs.available == 'true'
        env:
          OSTROM_URL: ${{ steps.server.outputs.url }}
        run: k6 run --summary-export race-summary.json load/race.js
      - name: No server yet
        if: steps.server.outputs.available != 'true'
        run: echo "ostrom-server does not meet the bench contract yet; load tests are blocked (RAPPORT.md)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: k6-nightly
          path: "*-summary.json"
          if-no-files-found: ignore
