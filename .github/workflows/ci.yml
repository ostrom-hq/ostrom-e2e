# CI of the bench itself. Job names = required checks on main.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["v*"]
  merge_group:
  workflow_dispatch:
# One run per workflow and ref; a new push cancels the previous run, except on main (every main commit is checked).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read

jobs:
  # One job on purpose: the organisation's runners are scarce (JOURNAL 30/10), so the bench takes one slot per PR.
  # Order: cheap checks first (types, lint of the workflows, k6 parse, unit tests at 100 %), then the full stack.
  ci:
    name: ci
    # A draft pull request runs no CI: mark it ready when you want it (JOURNAL 03:10).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: ostrom, POSTGRES_PASSWORD: ostrom, POSTGRES_DB: ostrom }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ostrom -d ostrom" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: actionlint (workflows, composite actions and templates)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest .
          ./actionlint -color .github/workflows/*.yml templates/*/ci.yml
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: k6 scripts parse (k6 inspect)
        run: for f in load/smoke.js load/race.js load/soak.js; do k6 inspect "$f" > /dev/null; done
      - name: Unit tests of the bench, 100 % thresholds
        run: pnpm test:coverage
      # Full stack: the real server and the real `ostrom` built from the main branches of ostrom-server and ostrom-cli.
      # A repository that does not meet the contract yet leaves its scenarios as todos (« bloqué »), it does not fail.
      - name: Real Ostrom server
        id: server
        uses: ./.github/actions/server
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY_SERVER }}
          database-url: postgresql://localhost:5432/ostrom
          required: "false"
      - name: Real ostrom CLI
        id: cli
        uses: ./.github/actions/cli
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY_CLI }}
          required: "false"
      - name: Scenarios
        env:
          OSTROM_E2E_SERVER_URL: ${{ steps.server.outputs.available == 'true' && steps.server.outputs.url || '' }}
          OSTROM_E2E_CLI_BIN: ${{ steps.cli.outputs.available == 'true' && steps.cli.outputs.bin || '' }}
        run: pnpm e2e --reporter=default --reporter=json --outputFile=e2e-results.json
      - name: Summary
        if: always()
        run: |
          # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
          node -e '
            const r = require("./e2e-results.json");
            const n = (s) => r.testResults.flatMap((f) => f.assertionResults).filter((a) => a.status === s).length;
            const line = `### Bench e2e\n\nserver: ${process.env.S || "absent"} · cli: ${process.env.C || "absent"}\n\n| passed | failed | todo | skipped |\n|---|---|---|---|\n| ${n("passed")} | ${n("failed")} | ${n("todo")} | ${n("pending") + n("skipped")} |\n`;
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, line);
          ' || true
        env:
          S: ${{ steps.server.outputs.available == 'true' && steps.server.outputs.sha || '' }}
          C: ${{ steps.cli.outputs.available == 'true' && steps.cli.outputs.sha || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: e2e-results, path: e2e-results.json, if-no-files-found: ignore }
