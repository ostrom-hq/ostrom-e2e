# CI of the bench itself. Job names = required checks on main.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["[0-9]*"]
  merge_group:
  workflow_dispatch:
    inputs:
      server_image:
        description: >
          A published image of ostrom-server to run the scenarios against, instead of building main
          (ostromhq/ostrom-server:sha-<commit> on Docker Hub): the run a PARCOURS cell cites (JOURNAL 03/11 00:06).
        required: false
        default: ""
# One run per workflow and ref; a new push cancels the previous run, except on main (every main commit is checked).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  # pulls a published image of ostrom-server when a dispatch names one (server_image)
  packages: read

jobs:
  # One job on purpose: the organisation's runners are scarce (JOURNAL 30/10), so the bench takes one slot per PR.
  # Order: cheap checks first (types, lint of the workflows, k6 parse, unit tests at 100 %), then the full stack.
  ci:
    name: ci
    # A draft pull request runs no CI: mark it ready when you want it (JOURNAL 03:10).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      stripe-mock:
        image: stripe/stripe-mock@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78 # latest, 2026-10-01 (as ostrom-server)
        ports: ["12111:12111"]
      # The fake TeamCode team of E2E-TC-003/004 (ostrom-helm compose/demo/teamcode, the demo's MySQL 8.4).
      teamcode-db:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: teamcode-root, MYSQL_DATABASE: teamcode }
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pteamcode-root" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: actionlint (workflows, composite actions and templates)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest .
          ./actionlint -color .github/workflows/*.yml templates/*/ci.yml
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - name: k6 scripts parse (k6 inspect)
        run: for f in load/smoke.js load/race.js load/soak.js load/chart-journeys.js load/inference.js load/streams.js load/cut.js load/mcp.js load/burst.js; do k6 inspect "$f" > /dev/null; done
      - name: Unit tests of the bench, 100 % thresholds
        run: pnpm test:coverage
      # Full stack: the real server and the real `ostrom` built from the main branches of ostrom-server and ostrom-cli.
      # The server runs as its own image (built by jib on main, the JVM server of decision 0001), the artefact that ships.
      # Both now meet the contract on main: a server or CLI that does not build fails the job, it never leaves the
      # scenarios silently skipped (run 41028221230 was green with neither, ostrom-core unreadable).
      - name: Sign-in mail directory (written by the server's non-root user, read by the scenarios)
        run: mkdir -p "$RUNNER_TEMP/ostrom-mail" && chmod 0777 "$RUNNER_TEMP/ostrom-mail"
      # The GitHub App of the bench: a key made for this run only, and the fake GitHub of scenarios/github-install
      # on a fixed port, so that the server started before the scenarios already points at it.
      - name: Test key of the bench's GitHub App
        run: echo "E2E_GITHUB_APP_PEM=$(openssl genrsa -traditional 2048 2>/dev/null | awk '{printf "%s\\n", $0}')" >> "$GITHUB_ENV"
      # The fake TeamCode team of ostrom-helm (helm#25): its schema and rows, a read-only user as `ostrom import
      # teamcode` reads with, and its key file (fake, public). A missing checkout or load fails the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-helm
          # pinned: the scenarios name its accounts and refresh tokens; a new seed is taken by moving this SHA
          ref: 4f03cd375d7309da4f58388a533f704f883a0d49
          ssh-key: ${{ secrets.DEPLOY_KEY_HELM }}
          path: .ostrom/helm
          sparse-checkout: compose/demo/teamcode
          persist-credentials: false
      - name: Fake TeamCode team in MySQL (helm compose/demo/teamcode)
        env:
          TEAMCODE: .ostrom/helm/compose/demo/teamcode
        run: |
          sql() { docker run --rm -i --network host -e MYSQL_PWD=teamcode-root mysql:8.4 mysql -h127.0.0.1 -P3307 -uroot "$@"; }
          sql teamcode < "$TEAMCODE/01-schema.sql"
          sql teamcode < "$TEAMCODE/02-seed.sql"
          # the demo's own read-only user (helm's 03-readonly.sh), the mysql client of the image reaching the service
          docker run --rm --network host -v "$PWD/$TEAMCODE:/teamcode:ro" -e MYSQL_HOST=127.0.0.1 -e MYSQL_TCP_PORT=3307 \
            -e MYSQL_ROOT_PASSWORD=teamcode-root -e MYSQL_DATABASE=teamcode -e TEAMCODE_RO_PASSWORD=teamcode-ro \
            mysql:8.4 sh /teamcode/03-readonly.sh
      # `ostrom import teamcode` reads TeamCode with the mysql client on the PATH
      - name: mysql client for ostrom import teamcode
        run: |
          command -v mysql || { sudo apt-get update -q && sudo apt-get install -yq mysql-client; }
          MYSQL_PWD=teamcode-ro mysql -h127.0.0.1 -P3307 -uteamcode_ro teamcode -N -e "SELECT COUNT(*) FROM accounts WHERE team_id = 'default'"
      - name: Real Ostrom server (image of ostrom-server main)
        id: server
        uses: ./.github/actions/server
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY_SERVER }}
          core-key: ${{ secrets.DEPLOY_KEY_CORE }}
          database-url: postgresql://localhost:5432/ostrom
          # The superuser of the service only creates the roles; the server migrates as ostrom_owner, serves as ostrom_app.
          database-admin-url: postgresql://postgres:postgres@localhost:5432/postgres
          image: "true"
          published-image: ${{ inputs.server_image }}
          # Test values of the bench, never real ones: stripe-mock behind billing, sign-in mails written to a directory.
          extra-env: |
            OSTROM_STRIPE_SECRET_KEY=sk_test_e2e
            OSTROM_STRIPE_WEBHOOK_SECRET=whsec_e2e_bench
            # Read limits (ostrom-server#181) as the server's journeys set them: k6 gates reads the approver's approvals
            # 20 times a second, past the default 600 a minute of one subject.
            OSTROM_READS_PER_MINUTE=6000
            OSTROM_READS_IN_FLIGHT=64
            OSTROM_READ_WAITS_IN_FLIGHT=256
            OSTROM_STRIPE_API_BASE=http://127.0.0.1:12111
            OSTROM_MAIL_DIR=/var/lib/ostrom/mail
            OSTROM_PUBLIC_URL=http://127.0.0.1:4600
            OSTROM_CONSOLE_URL=http://127.0.0.1:4600
            # The scenarios sign people up through the fake GitHub, without invitation (ostrom-server#370).
            OSTROM_SIGNUP=open
            OSTROM_TRUSTED_PROXIES=127.0.0.1/32
            OSTROM_GITHUB_WEB_URL=http://127.0.0.1:4610
            OSTROM_GITHUB_API_URL=http://127.0.0.1:4610
            OSTROM_GITHUB_CLIENT_ID=Iv1.e2ebench
            OSTROM_GITHUB_CLIENT_SECRET=e2e-bench-fake-github
            OSTROM_GITHUB_API=http://127.0.0.1:4700
            OSTROM_GITHUB_WEB=http://127.0.0.1:4700
            OSTROM_GITHUB_APP_ID=1
            OSTROM_GITHUB_APP_SLUG=ostrom-e2e
            OSTROM_GITHUB_APP_PEM=${{ env.E2E_GITHUB_APP_PEM }}
            OSTROM_GITHUB_APP_CLIENT_ID=Iv1.fake
            OSTROM_GITHUB_APP_CLIENT_SECRET=fake-client-secret
            OSTROM_GITHUB_WEBHOOK_SECRET=whsec_github_e2e
            OSTROM_SHARING_CLAUDE_TOKEN_URL=http://127.0.0.1:4620/v1/oauth/token
            OSTROM_SHARING_CODEX_TOKEN_URL=http://127.0.0.1:4620/v1/oauth/token
            OSTROM_GATEWAY_ANTHROPIC_URL=http://127.0.0.1:4620
            OSTROM_GATEWAY_CODEX_URL=http://127.0.0.1:4620
            OSTROM_ARTIFACTS_CONTENT_ORIGIN=http://localhost:4601
            # Cloud sessions for every organization of the bench, on the registered driver (the server only plans them):
            # no runner takes one here, so a workflow run's agent node waits on its session until the scenario ends it.
            OSTROM_RUNNERS_DRIVER=registered
            OSTROM_RUNNERS_SERVER_URL=http://127.0.0.1:4600
            OSTROM_RUNNERS_ALLOWED_ORGS=*
          docker-args: -v ${{ runner.temp }}/ostrom-mail:/var/lib/ostrom/mail
          required: "true"
      - name: Real ostrom CLI
        id: cli
        uses: ./.github/actions/cli
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY_CLI }}
          core-key: ${{ secrets.DEPLOY_KEY_CORE }}
          required: "true"
      # E2E-SWEEP: the contract of ostrom-core main (OpenAPI, api/contract/served-routes.txt) and the routes the server
      # under test serves (core's scripts/served-routes.py read on its sources): a served route without a case fails the
      # sweep, so a new route cannot be forgotten. A missing checkout fails the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: .ostrom/core-contract
          sparse-checkout: |
            api/openapi.yaml
            api/contract
            scripts/served-routes.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Contract of the sweep (served routes, OpenAPI as JSON)
        run: |
          python3 .ostrom/core-contract/scripts/served-routes.py .ostrom/server > "$RUNNER_TEMP/served-by-server.txt"
          cat .ostrom/core-contract/api/contract/served-routes.txt "$RUNNER_TEMP/served-by-server.txt" > "$RUNNER_TEMP/served-routes.txt"
          yq -o=json .ostrom/core-contract/api/openapi.yaml > "$RUNNER_TEMP/openapi.json"
          wc -l "$RUNNER_TEMP/served-by-server.txt" "$RUNNER_TEMP/served-routes.txt" "$RUNNER_TEMP/openapi.json"
      - name: Scenarios
        env:
          OSTROM_E2E_SERVER_URL: ${{ steps.server.outputs.available == 'true' && steps.server.outputs.url || '' }}
          OSTROM_E2E_CLI_BIN: ${{ steps.cli.outputs.available == 'true' && steps.cli.outputs.bin || '' }}
          OSTROM_E2E_MAIL_DIR: ${{ runner.temp }}/ostrom-mail
          OSTROM_E2E_STRIPE_WEBHOOK_SECRET: whsec_e2e_bench
          OSTROM_E2E_FAKE_GITHUB_PORT: "4610"
          # As the superuser of the bench's throwaway database: to age a session (AUTH-007), to make an imported account
          # wait for a reconnection and to read the org's audit chain (TC-003/004).
          OSTROM_E2E_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/ostrom
          OSTROM_E2E_GITHUB_PORT: "4700"
          # E2E-TC-003/004: the fake TeamCode team and the fake provider token endpoint the server was pointed at; E2E-SHARE-006:
          # the same fake stands for the providers' APIs behind the gateway, so a call served by an account would show there.
          OSTROM_E2E_TEAMCODE_DB: mysql://teamcode_ro@127.0.0.1:3307/teamcode
          OSTROM_E2E_TEAMCODE_PASSWORD: teamcode-ro
          OSTROM_E2E_TEAMCODE_KEY_FILE: ${{ github.workspace }}/.ostrom/helm/compose/demo/teamcode/key.txt
          OSTROM_E2E_FAKE_TOKENS_PORT: "4620"
          # E2E-SWEEP: the routes to sweep and the operations they come from (step above).
          OSTROM_E2E_SERVED_ROUTES: ${{ runner.temp }}/served-routes.txt
          OSTROM_E2E_OPENAPI: ${{ runner.temp }}/openapi.json
        run: pnpm e2e --reporter=default --reporter=json --outputFile=e2e-results.json
      # Short load test on the served public routes; the thresholds of load/smoke.js fail the job.
      - name: k6 smoke against the server image (health, instance)
        if: steps.server.outputs.available == 'true'
        env:
          OSTROM_URL: ${{ steps.server.outputs.url }}
          OSTROM_LOAD_SCENARIOS: health,instance
          K6_SUMMARY_TREND_STATS: "avg,min,med,max,p(90),p(95),p(99)"
        run: k6 run --summary-export smoke-summary.json load/smoke.js
      # Gate load tests (LOAD-002 gates, LOAD-006 race): they run as soon as the server serves gates, people,
      # organizations and workflows; until then scripts/load-setup.ts says what is missing and they are skipped.
      - name: Gate load setup (requester token, approver session)
        id: loadsetup
        if: steps.server.outputs.available == 'true'
        env:
          OSTROM_E2E_SERVER_URL: ${{ steps.server.outputs.url }}
          OSTROM_E2E_MAIL_DIR: ${{ runner.temp }}/ostrom-mail
        run: node scripts/load-setup.ts
      - name: k6 gates (push to main + yes) and race (100 simultaneous yes → 1 × 200, 99 × 409)
        if: steps.loadsetup.outputs.ready == 'true'
        env:
          OSTROM_URL: ${{ steps.server.outputs.url }}
          OSTROM_LOAD_SCENARIOS: gates
          # The session's writes need the console's origin (S2-08): the bench's console URL.
          OSTROM_LOAD_APPROVER_ORIGIN: http://127.0.0.1:4600
          K6_SUMMARY_TREND_STATS: "avg,min,med,max,p(90),p(95),p(99)"
        run: |
          # The race runs even when a check of the gates fails: its own thresholds (1 × 200, 99 × 409) are
          # another question, and its numbers would be lost. The step fails if either run fails.
          rc=0
          k6 run --summary-export gates-summary.json load/smoke.js || rc=$?
          k6 run --summary-export race-summary.json load/race.js || rc=$?
          exit "$rc"
      - name: Server logs
        if: always() && steps.server.outputs.available == 'true'
        run: docker logs ostrom-e2e-server 2>&1 | tail -n 200
      - name: Summary
        if: always()
        run: |
          # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
          node -e '
            const r = require("./e2e-results.json");
            const n = (s) => r.testResults.flatMap((f) => f.assertionResults).filter((a) => a.status === s).length;
            const line = `### Bench e2e\n\nserver: ${process.env.S || "absent"} (${process.env.M}) · cli: ${process.env.C || "absent"} · gate load: ${process.env.G || "not run"}\n\n| passed | failed | todo | skipped |\n|---|---|---|---|\n| ${n("passed")} | ${n("failed")} | ${n("todo")} | ${n("pending") + n("skipped")} |\n`;
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, line);
          ' || true
          # p95/p99, errors and requests/s of the load tests (scripts/k6-summary.ts).
          node scripts/k6-summary.ts "smoke=smoke-summary.json" "gates=gates-summary.json" "race=race-summary.json" >> "$GITHUB_STEP_SUMMARY" || true
        env:
          S: ${{ steps.server.outputs.available == 'true' && steps.server.outputs.sha || '' }}
          M: ${{ steps.server.outputs.mode }}
          G: ${{ steps.loadsetup.outputs.ready == 'true' && 'run' || steps.loadsetup.outputs.reason }}
          C: ${{ steps.cli.outputs.available == 'true' && steps.cli.outputs.sha || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: e2e-results, path: "e2e-results.json\n*-summary.json", if-no-files-found: ignore }
