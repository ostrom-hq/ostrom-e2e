# Full-stack load pass of the Helm chart: the real server image (ostrom-server main), installed by ostrom-helm main's
# chart in a kind cluster (built-in PostgreSQL, `ostrom-server migrate` init container, 2 server replicas, ingress-nginx,
# namespace under the restricted Pod Security standard), loaded by QA's k6 scripts through the ingress. The job
# summary gives p95/p99, error rate and requests/s per script, and the peak CPU and memory of every pod (what the
# chart's `resources` are set from). The inference gateway and the MCP relay are loaded against fake upstreams in a
# namespace of their own (src/fake-upstreams.ts): the gateway's overhead against the fake called directly, the memory
# of open streams, a client that leaves mid-stream, and MCP servers that are slow or down.
# Not on pull requests: the organisation runs a single `ci` job per PR.
name: Chart load
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
# A load pass gates nothing: a newer run of the same ref replaces the one in progress (runners are scarce).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  chart-load:
    name: chart-load
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NS: ostrom
      CLUSTER: ostrom-load
      API_URL: http://api.ostrom.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The server needs ostrom-core next to its checkout (ostrom.core.local): GitHub Packages of another repository
      # are not readable from here, like in ostrom-server's own CI (JOURNAL 05:50).
      - name: Checkout ostrom-server main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-server
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY_SERVER }}
          path: .ostrom/server
          persist-credentials: false
      - name: ostrom-core version pinned by the server
        id: core
        run: echo "ref=$(tr -d '[:space:]' < .ostrom/server/gradle/ostrom-core.ref)" >> "$GITHUB_OUTPUT"
      - name: Checkout ostrom-core at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-core
          ref: ${{ steps.core.outputs.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY_CORE }}
          path: .ostrom/ostrom-core
          persist-credentials: false
      - name: Build ostrom-core from that checkout
        run: printf '\nostrom.core.local=true\n' >> .ostrom/server/gradle.properties
      # The action builds the image and then starts it against `database-url`; only the image is wanted here, so the
      # start is let fail (nothing listens there, `required: "false"`) and the next step checks the image.
      - name: Server image (ostrom-server main, its own Dockerfile)
        id: server
        uses: ./.github/actions/server
        with:
          path: .ostrom/server
          image: "true"
          database-url: postgresql://127.0.0.1:1/none
          required: "false"
      - name: The image is built
        env:
          SHA: ${{ steps.server.outputs.sha }}
        run: |
          docker rm -f ostrom-e2e-server >/dev/null 2>&1 || true
          if ! docker image inspect ostrom-server:e2e >/dev/null 2>&1; then
            echo "::error title=server image::ostrom-server@$SHA did not build (see the step above)"; exit 1
          fi
          docker images ostrom-server:e2e --format 'ostrom-server:e2e {{.Size}} (ostrom-server@'"$SHA"')'
      # The MCP relay reaches HTTPS servers only: the fake MCP servers get a certificate of a CA made for this run, and
      # the bench runs the server image with that CA appended to its system bundle (the binary is the same).
      # It never stops the job: on a failure the bench runs the server image as built, and the relay setup skips the MCP
      # passes with the reason (the server does not trust the fakes' certificate).
      - name: Bench CA, the fake MCP servers' certificate, and the server image that trusts it
        continue-on-error: true
        run: |
          docker tag ostrom-server:e2e ostrom-server:e2e-load
          d="$RUNNER_TEMP/fakes-tls"; mkdir -p "$d"; cd "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=Ostrom load bench CA" -keyout ca.key -out ca.crt \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes -subj "/CN=fakes.ostrom-fakes.svc" -keyout tls.key -out tls.csr
          printf 'subjectAltName=DNS:fakes.ostrom-fakes.svc,DNS:fakes.ostrom-fakes.svc.cluster.local\nextendedKeyUsage=serverAuth\n' > ext.cnf
          openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 -out tls.crt -extfile ext.cnf
          id=$(docker create ostrom-server:e2e)
          # Copied out read-only, as in the image: the bench's bundle is a new file.
          docker cp "$id:/etc/ssl/certs/ca-certificates.crt" system.crt
          docker rm "$id" >/dev/null
          mkdir -p image && cat system.crt ca.crt > image/bundle.crt
          printf 'FROM ostrom-server:e2e\nCOPY bundle.crt /etc/ssl/certs/ca-certificates.crt\n' > image/Dockerfile
          docker build -q -t ostrom-server:e2e-load image
      - name: Checkout ostrom-helm main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ostrom-hq/ostrom-helm
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY_HELM }}
          path: .ostrom/helm
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.17.2 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, package-manager-cache: false }
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      # One node that publishes ports 80 and 443 of ingress-nginx on the runner (kind's documented ingress setup).
      - name: kind cluster configuration
        run: |
          cat > "$RUNNER_TEMP/kind.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - { containerPort: 80, hostPort: 80, protocol: TCP }
                - { containerPort: 443, hostPort: 443, protocol: TCP }
          EOF
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.29.0
          node_image: kindest/node:v1.31.9
          cluster_name: ${{ env.CLUSTER }}
          config: ${{ runner.temp }}/kind.yaml
      - name: ingress-nginx and metrics-server (pinned manifests, checked by digest)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ingress-nginx.yaml" \
            https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          curl -fsSL -o "$RUNNER_TEMP/metrics-server.yaml" \
            https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.1/components.yaml
          sha256sum -c <<EOF
          2a3ae008c8786431115502644e77ab398fdebfb721a5d1195ed3089cde3299df  $RUNNER_TEMP/ingress-nginx.yaml
          3c7f57cdbee0f57fb0259a150e8f6d6cb4f29d72d1aa5dce8803151dd6d4c2a1  $RUNNER_TEMP/metrics-server.yaml
          EOF
          # kind's kubelets serve self-signed certificates: added before applying, so that one ReplicaSet ever exists.
          sed -i 's|^\( *\)- --metric-resolution=15s$|&\n\1- --kubelet-insecure-tls|' "$RUNNER_TEMP/metrics-server.yaml"
          grep -q -- '- --kubelet-insecure-tls' "$RUNNER_TEMP/metrics-server.yaml"
          kubectl apply -f "$RUNNER_TEMP/ingress-nginx.yaml"
          kubectl apply -f "$RUNNER_TEMP/metrics-server.yaml"
          kubectl -n ingress-nginx wait --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=300s
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=300s
      - name: Load the server image into kind
        run: kind load docker-image ostrom-server:e2e-load --name "$CLUSTER"
      # The fake provider (HTTP 8080) and the fake MCP servers (HTTPS 8443; 8444 listens to nothing, the `down` server),
      # src/fake-upstreams.ts run by Node from a ConfigMap. Reached by the server (an extraEgress rule of the chart's
      # NetworkPolicy, below) and by k6 through the ingress (fake.ostrom.test), the baseline of the gateway's overhead.
      - name: Fake upstreams of the gateway and the MCP relay (namespace ostrom-fakes)
        # Like the CA: a failure here skips the relay passes (their setup gives the reason), never the passes before.
        continue-on-error: true
        run: |
          # node:24-alpine pinned by digest (2026-11-03), loaded into kind under a local tag.
          docker pull -q node@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85
          docker tag node@sha256:8a32c8cf649a49915a66e81e7a609223c708d0adabf288ee3f4077d765542f85 ostrom-fakes-node:24
          kind load docker-image ostrom-fakes-node:24 --name "$CLUSTER"
          kubectl create namespace ostrom-fakes
          kubectl -n ostrom-fakes create secret tls fakes-tls --cert="$RUNNER_TEMP/fakes-tls/tls.crt" --key="$RUNNER_TEMP/fakes-tls/tls.key"
          echo '{"type":"module"}' > "$RUNNER_TEMP/fakes-package.json"
          kubectl -n ostrom-fakes create configmap fakes-code --from-file=fake-upstreams-src.ts=src/fake-upstreams.ts \
            --from-file=fake-upstreams-bin.ts=bin/fake-upstreams.ts --from-file=package.json="$RUNNER_TEMP/fakes-package.json"
          cat <<'EOF' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: fakes, namespace: ostrom-fakes, labels: { app: fakes } }
          spec:
            replicas: 1
            selector: { matchLabels: { app: fakes } }
            template:
              metadata: { labels: { app: fakes } }
              spec:
                securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
                containers:
                  - name: fakes
                    image: ostrom-fakes-node:24
                    imagePullPolicy: IfNotPresent
                    command: ["node", "/app/bin/fake-upstreams.ts"]
                    env:
                      - { name: FAKE_TLS_KEY, value: /tls/tls.key }
                      - { name: FAKE_TLS_CERT, value: /tls/tls.crt }
                      - { name: FAKE_MCP_SLOW_MS, value: "1000" }
                    ports: [{ containerPort: 8080 }, { containerPort: 8443 }]
                    readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 2 }
                    # A small CPU request: the kind node has 2 CPUs, and since ostrom-helm#36 the chart asks 250m per
                    # server replica and 250m for PostgreSQL; 200m here left PostgreSQL unscheduled (run 41542985718).
                    resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 512Mi } }
                    securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
                    volumeMounts:
                      - { name: code, mountPath: /app }
                      - { name: tls, mountPath: /tls, readOnly: true }
                volumes:
                  - name: code
                    configMap:
                      name: fakes-code
                      items:
                        - { key: fake-upstreams-src.ts, path: src/fake-upstreams.ts }
                        - { key: fake-upstreams-bin.ts, path: bin/fake-upstreams.ts }
                        - { key: package.json, path: package.json }
                  - name: tls
                    secret: { secretName: fakes-tls, defaultMode: 0444 }
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: fakes, namespace: ostrom-fakes }
          spec:
            selector: { app: fakes }
            ports:
              - { name: http, port: 8080, targetPort: 8080 }
              - { name: https, port: 8443, targetPort: 8443 }
              - { name: down, port: 8444, targetPort: 8444 }
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: fakes
            namespace: ostrom-fakes
            # The same as the chart's API Ingress (apiAnnotations): the baseline goes through the same proxy settings.
            annotations:
              nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
              nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
              nginx.ingress.kubernetes.io/proxy-buffering: "off"
          spec:
            ingressClassName: nginx
            rules:
              - host: fake.ostrom.test
                http:
                  paths:
                    - { path: /, pathType: Prefix, backend: { service: { name: fakes, port: { number: 8080 } } } }
          EOF
          kubectl -n ostrom-fakes rollout status deployment/fakes --timeout=180s
      - name: Namespace under the restricted Pod Security standard
        run: |
          kubectl create namespace "$NS"
          kubectl label namespace "$NS" pod-security.kubernetes.io/enforce=restricted pod-security.kubernetes.io/enforce-version=latest
      # Test values of the bench, never real ones. Sign-in mails go to a directory (as in ci.yml); billing stays off:
      # no route of the load pass needs it, and the chart's NetworkPolicy denies the server any private address, so an
      # in-cluster stripe-mock would not be reachable anyway. Test accounts are allowed for `seed-test-account`.
      - name: helm install charts/ostrom (built-in PostgreSQL, migrate init container, 2 server replicas)
        run: |
          cat > "$RUNNER_TEMP/load-values.yaml" <<'EOF'
          global:
            imagePullPolicy: IfNotPresent
            urls: { api: "http://api.ostrom.test", app: "http://app.ostrom.test", site: "http://ostrom.test" }
          server:
            image: { repository: ostrom-server, tag: e2e-load }
            replicas: 2
            trustedProxies: 10.244.0.0/16
            config:
              OSTROM_MAIL_DIR: /var/lib/ostrom/mail
              OSTROM_ALLOW_TEST_ACCOUNTS: "true"
              # The fake provider and the fake MCP servers (namespace ostrom-fakes), on cluster addresses.
              OSTROM_GATEWAY_ANTHROPIC_URL: http://fakes.ostrom-fakes.svc:8080
              OSTROM_MCP_ALLOW_PRIVATE_UPSTREAMS: "true"
              OSTROM_MCP_CALL_TIMEOUT_MS: "5000"
            secretEnv:
              OSTROM_GATEWAY_ANTHROPIC_API_KEY: fake-instance-key
          networkPolicy:
            server:
              extraEgress:
                - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ostrom-fakes } } }]
                  ports: [{ protocol: TCP, port: 8080 }, { protocol: TCP, port: 8443 }, { protocol: TCP, port: 8444 }]
          migrations: { initContainer: true }
          postgresql:
            enabled: true
            persistence: { size: 1Gi }
          cloudSessions: { enabled: false }
          polis: { enabled: false }
          site: { enabled: false }
          # No console image is built by the bench: the API is reached on its own host only.
          web: { enabled: false }
          ingress:
            className: nginx
            tls: { enabled: false }
            hosts: { api: api.ostrom.test, app: app.ostrom.test, site: ostrom.test }
          EOF
          helm install ostrom .ostrom/helm/charts/ostrom -n "$NS" -f "$RUNNER_TEMP/load-values.yaml" --wait --timeout 10m
          kubectl -n "$NS" rollout status deployment/ostrom-server --timeout=300s
          kubectl -n "$NS" get pods -o wide
      - name: The API host answers through the ingress
        run: |
          echo "127.0.0.1 api.ostrom.test app.ostrom.test fake.ostrom.test" | sudo tee -a /etc/hosts
          for i in $(seq 1 60); do
            if curl -fsS "$API_URL/health" >/dev/null 2>&1; then echo "ingress up after $i s"; exit 0; fi
            sleep 1
          done
          curl -sS -i "$API_URL/health" || true; exit 1
      - name: Sample CPU and memory of every pod (kubectl top, every 5 s, in the background)
        run: |
          for _ in $(seq 1 36); do kubectl top pods -n "$NS" >/dev/null 2>&1 && break; sleep 5; done
          kubectl top pods -n "$NS" || echo "::warning title=metrics::kubectl top not ready yet, samples may start late"
          sample() {
            while :; do
              ts=$(date +%s)
              for ns in "$NS" ingress-nginx; do
                kubectl top pods -n "$ns" --no-headers 2>/dev/null | sed "s|^|$ts $ns |"
              done
              sleep 5
            done
          }
          sample >> "$RUNNER_TEMP/top.txt" 2>/dev/null < /dev/null &
          echo $! > "$RUNNER_TEMP/top.pid"
          disown || true
      # Same invocation as ci.yml, through the ingress; --summary-trend-stats only adds p(99) to the exported summary.
      - name: k6 smoke (health, instance)
        env:
          OSTROM_URL: ${{ env.API_URL }}
          OSTROM_LOAD_SCENARIOS: health,instance
        run: k6 run --summary-trend-stats "avg,min,med,max,p(90),p(95),p(99)" --summary-export smoke-summary.json load/smoke.js
      - name: QA account (ostrom-server seed-test-account, in a server pod)
        run: |
          out=$(kubectl -n "$NS" exec deployment/ostrom-server -c server -- \
            /usr/local/bin/ostrom-server seed-test-account "k6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@e2e.ostrom.test")
          line=$(printf '%s\n' "$out" | grep -E '^\{.*"organizationId"' | tail -n 1)
          token=$(printf '%s' "$line" | node -e 'const a = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write(a.token || "")')
          org=$(printf '%s' "$line" | node -e 'const a = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write(a.organizationId || "")')
          if [ -z "$token" ] || [ -z "$org" ]; then echo "::error title=seed-test-account::no token in its output"; exit 1; fi
          echo "::add-mask::$token"
          { echo "OSTROM_LOAD_SEED_TOKEN=$token"; echo "OSTROM_LOAD_SEED_ORG=$org"; } >> "$GITHUB_ENV"
      - name: k6 chart journeys (me, organizations, rename)
        env:
          OSTROM_URL: ${{ env.API_URL }}
        run: k6 run --summary-trend-stats "avg,min,med,max,p(90),p(95),p(99)" --summary-export journeys-summary.json load/chart-journeys.js
      # scripts/load-setup.ts reads the sign-in links from a directory of the runner. In the chart the mails are written
      # in each server pod's own volume: the setup talks to one pod (port-forward) whose mail directory, on the kind
      # node's /var volume, is bind-mounted on the runner. Checked by one sign-in mail; else the setup says why it skips.
      - name: Gate load setup (requester token, approver session)
        id: loadsetup
        env:
          # The only origin a browser session may write from: the chart's console URL (global.urls.app, S2-08).
          OSTROM_E2E_CONSOLE_ORIGIN: http://app.ostrom.test
        run: |
          pod=$(kubectl -n "$NS" get pod -l app.kubernetes.io/component=server -o jsonpath='{.items[0].metadata.name}')
          kubectl -n "$NS" port-forward "pod/$pod" 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/port-forward.pid"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1 && break; sleep 1; done
          mail=""
          uid=$(kubectl -n "$NS" get pod "$pod" -o jsonpath='{.metadata.uid}')
          var=$(docker inspect "$CLUSTER-control-plane" --format '{{range .Mounts}}{{if eq .Destination "/var"}}{{.Source}}{{end}}{{end}}')
          src="$var/lib/kubelet/pods/$uid/volumes/kubernetes.io~empty-dir/data/mail"
          if [ -n "$var" ] && sudo test -d "$var/lib/kubelet/pods/$uid"; then
            sudo mkdir -p "$src" && sudo chown 65532:65532 "$src"
            mkdir -p "$RUNNER_TEMP/ostrom-mail" && sudo mount --bind "$src" "$RUNNER_TEMP/ostrom-mail"
            probe="mail-probe-${GITHUB_RUN_ID}@e2e.ostrom.test"
            curl -fsS -X POST -H 'content-type: application/json' -d "{\"email\":\"$probe\"}" \
              http://127.0.0.1:18080/api/v1/auth/email >/dev/null || true
            if grep -qs "^To: $probe" "$RUNNER_TEMP"/ostrom-mail/*; then mail="$RUNNER_TEMP/ostrom-mail"; fi
          fi
          [ -n "$mail" ] || echo "::warning title=mail directory::the sign-in mails of $pod are not readable from the runner"
          echo "OSTROM_LOAD_MAIL_DIR=$mail" >> "$GITHUB_ENV"
          OSTROM_E2E_SERVER_URL=http://127.0.0.1:18080 OSTROM_E2E_MAIL_DIR="$mail" node scripts/load-setup.ts
      # Registered runners (`ostrom-runner machine`): 500 registered in 5 organizations of their own (100 at most each),
      # through the same pod and mail directory as the gate setup, then 100 and then 500 of them beating every 5 s with an
      # empty report, a phase each (runner-phases.txt, apart from the streams' phases.txt that relay-summary.ts reads):
      # the route's p95 is k6's, the server pods' CPU and memory the sampler's.
      # The queries per heartbeat and their plans are ostrom-server's bench (RunnersHeartbeatBenchTest). Before the gates'
      # race: it may get a server pod OOM-killed (run 41640105075), and with it the port-forward and mail directory the
      # setup reads.
      - name: Registered runners load setup (500 runners in 5 organizations)
        id: runnerssetup
        if: always() && steps.loadsetup.outcome != 'skipped'
        env:
          OSTROM_E2E_CONSOLE_ORIGIN: http://app.ostrom.test
          OSTROM_LOAD_RUNNERS: "500"
          OSTROM_LOAD_RUNNERS_FILE: ${{ runner.temp }}/runners.json
        run: OSTROM_E2E_SERVER_URL=http://127.0.0.1:18080 OSTROM_E2E_MAIL_DIR="${OSTROM_LOAD_MAIL_DIR:-}" node scripts/runners-load-setup.ts
      - name: k6 registered runners' heartbeats (100, then 500, every 5 s, 2 minutes each)
        if: always() && steps.runnerssetup.outputs.ready == 'true'
        env:
          OSTROM_URL: ${{ env.API_URL }}
          OSTROM_LOAD_RUNNERS_FILE: ${{ runner.temp }}/runners.json
          OSTROM_LOAD_RUNNER_INTERVAL: "5"
        run: |
          rc=0
          for n in 100 500; do
            scripts/server-pods.sh ready; before=$(scripts/server-pods.sh restarts)
            start=$(date +%s)
            k6 run --summary-trend-stats "avg,min,med,max,p(90),p(95),p(99)" --summary-export "runners-$n-summary.json" \
              -e OSTROM_LOAD_RUNNERS="$n" load/runners.js || rc=$?
            echo "runners-$n $n $start $(date +%s)" >> runner-phases.txt
            sleep 15
            scripts/server-pods.sh crashed "$before" || rc=1
          done
          exit "$rc"
      - name: k6 gates (push to main + yes) and race (100 simultaneous yes → 1 × 200, 99 × 409)
        if: steps.loadsetup.outputs.ready == 'true'
        env:
          OSTROM_URL: ${{ env.API_URL }}
          OSTROM_LOAD_SCENARIOS: gates
          OSTROM_LOAD_APPROVER_ORIGIN: http://app.ostrom.test
          # ostrom-server#127: the answer to a yes carries the signed receipt; the check is on.
          OSTROM_E2E_ANSWER_RECEIPT: "1"
        run: |
          # The race runs even when a check of the gates fails: its own thresholds (1 × 200, 99 × 409) are
          # another question, and its numbers would be lost. The step fails if either run fails.
          rc=0
          k6 run --summary-trend-stats "avg,min,med,max,p(90),p(95),p(99)" --summary-export gates-summary.json load/smoke.js || rc=$?
          k6 run --summary-trend-stats "avg,min,med,max,p(90),p(95),p(99)" --summary-export race-summary.json load/race.js || rc=$?
          exit "$rc"
      # The member, its token and the MCP servers of the gateway and relay load tests (scripts/relay-load-setup.ts),
      # through the same pod and mail directory as the gate setup.
      - name: Gateway and relay load setup (member token, MCP servers on the fakes)
        id: relaysetup
        if: always() && steps.loadsetup.outcome != 'skipped'
        env:
          OSTROM_E2E_CONSOLE_ORIGIN: http://app.ostrom.test
          OSTROM_LOAD_FAKE_MCP_URL: https://fakes.ostrom-fakes.svc:8443
          OSTROM_LOAD_FAKE_MCP_DOWN_URL: https://fakes.ostrom-fakes.svc:8444/mcp/fast
        run: OSTROM_E2E_SERVER_URL=http://127.0.0.1:18080 OSTROM_E2E_MAIL_DIR="${OSTROM_LOAD_MAIL_DIR:-}" node scripts/relay-load-setup.ts
      # Each relay phase starts on Ready server pods and fails on its own restart, with the crashed container's last
      # lines (scripts/server-pods.sh): a crash in one phase never passes for the next phase's result (run 41539188060:
      # the 200 streams crashed both pods, then the cut and the MCP phases only met nginx's 503). The heaviest phase,
      # the open streams, runs last.
      - name: k6 gateway overhead (direct and through the gateway, JSON and stream)
        if: always() && steps.relaysetup.outputs.inference == 'true'
        env:
          OSTROM_URL: ${{ env.API_URL }}
          OSTROM_LOAD_FAKE_URL: http://fake.ostrom.test
        run: |
          scripts/server-pods.sh ready; before=$(scripts/server-pods.sh restarts); rc=0
          k6 run --summary-trend-stats "avg,min,med,max,p(90),p(95),p(99)" --summary-export inference-summary.json load/inference.js || rc=$?
          scripts/server-pods.sh crashed "$before" || rc=1
          exit "$rc"
      - name: k6 client cut mid-stream (upstream released, usage recorded)
        if: always() && steps.relaysetup.outputs.inference == 'true'
        env:
          OSTROM_URL: ${{ env.API_URL }}
          OSTROM_LOAD_FAKE_URL: http://fake.ostrom.test
        run: |
          scripts/server-pods.sh ready; before=$(scripts/server-pods.sh restarts); rc=0
          k6 run --summary-trend-stats "avg,min,med,max,p(90),p(95),p(99)" --summary-export cut-summary.json load/cut.js || rc=$?
          scripts/server-pods.sh crashed "$before" || rc=1
          exit "$rc"
      - name: k6 MCP relay (fast, slow, hanging and down servers at once)
        if: always() && steps.relaysetup.outputs.mcp == 'true'
        env:
          OSTROM_URL: ${{ env.API_URL }}
          OSTROM_LOAD_MCP_DEADLINE_MS: "5000"
        run: |
          scripts/server-pods.sh ready; before=$(scripts/server-pods.sh restarts); rc=0
          k6 run --summary-trend-stats "avg,min,med,max,p(90),p(95),p(99)" --summary-export mcp-summary.json load/mcp.js || rc=$?
          scripts/server-pods.sh crashed "$before" || rc=1
          exit "$rc"
      # Each phase's start and end go to phases.txt: scripts/relay-summary.ts reads the pods' memory in each window. A
      # restart of a server pod (an OOM kill at the chart's 256 Mi, or a crash) fails the phase, and the 200 streams
      # then start on Ready pods again.
      - name: k6 open streams (50, then 200, a minute each) and the pods' memory
        if: always() && steps.relaysetup.outputs.inference == 'true'
        env:
          OSTROM_URL: ${{ env.API_URL }}
        run: |
          rc=0
          for n in 50 200; do
            scripts/server-pods.sh ready; before=$(scripts/server-pods.sh restarts)
            start=$(date +%s)
            k6 run --summary-trend-stats "avg,min,med,max,p(90),p(95),p(99)" --summary-export "streams-$n-summary.json" \
              -e OSTROM_LOAD_STREAMS="$n" load/streams.js || rc=$?
            echo "streams-$n $n $start $(date +%s)" >> phases.txt
            sleep 30
            scripts/server-pods.sh crashed "$before" || rc=1
          done
          exit "$rc"
      - name: Stop the background sampler and port-forward
        if: always()
        run: |
          for f in top port-forward; do [ -f "$RUNNER_TEMP/$f.pid" ] && kill "$(cat "$RUNNER_TEMP/$f.pid")" 2>/dev/null || true; done
          mountpoint -q "$RUNNER_TEMP/ostrom-mail" && sudo umount "$RUNNER_TEMP/ostrom-mail" || true
          cp "$RUNNER_TEMP/top.txt" top-samples.txt 2>/dev/null || true
      - name: Summary (k6 per script, peak CPU and memory per pod, restarts)
        if: always()
        env:
          SERVER_SHA: ${{ steps.server.outputs.sha }}
          GATES: ${{ steps.loadsetup.outputs.ready == 'true' && 'run' || steps.loadsetup.outputs.reason }}
          RUNNERS: ${{ steps.runnerssetup.outputs.ready == 'true' && 'run' || steps.runnerssetup.outputs.reason }}
          RELAY: >-
            inference ${{ steps.relaysetup.outputs.inference == 'true' && 'run' || 'not run' }},
            mcp ${{ steps.relaysetup.outputs.mcp == 'true' && 'run' || 'not run' }}${{ steps.relaysetup.outputs.reason && format(' ({0})', steps.relaysetup.outputs.reason) || '' }}
        run: |
          {
            echo "### Chart load pass (kind, ingress-nginx, 2 server replicas)"
            echo
            echo "ostrom-server@${SERVER_SHA:-?} · gates and race: ${GATES:-not run} · registered runners: ${RUNNERS:-not run}"
            echo
            node scripts/k6-summary.ts "smoke (health, instance)=smoke-summary.json" "chart journeys=journeys-summary.json" \
              "gates=gates-summary.json" "race=race-summary.json" "inference=inference-summary.json" \
              "50 streams=streams-50-summary.json" "200 streams=streams-200-summary.json" "cut streams=cut-summary.json" \
              "mcp relay=mcp-summary.json" "runners 100=runners-100-summary.json" \
              "runners 500=runners-500-summary.json" || echo "(no k6 summary)"
            echo
            echo "| runners phase | server pod | peak CPU | peak memory | samples |"
            echo "|---|---|---|---|---|"
            if [ -s runner-phases.txt ] && [ -s top-samples.txt ]; then
              while read -r phase _ start end; do
                awk -v p="$phase" -v s="$start" -v e="$end" -v ns="$NS" \
                  '$1 >= s && $1 <= e && $2 == ns && $3 ~ /server/ { c = $4; m = $5; sub(/m$/, "", c); sub(/Mi$/, "", m); n[$3]++
                     if (c + 0 > cpu[$3]) cpu[$3] = c + 0; if (m + 0 > mem[$3]) mem[$3] = m + 0 }
                   END { for (k in n) printf "| %s | %s | %d m | %d Mi | %d |\n", p, k, cpu[k], mem[k], n[k] }' top-samples.txt | sort
              done < runner-phases.txt
            else
              echo "| (not run) | | | | |"
            fi
            echo
            echo "gateway and relay: ${RELAY:-not run}"
            echo
            node scripts/relay-summary.ts inference-summary.json top-samples.txt phases.txt 2 || echo "(no relay summary)"
            echo
            echo "| pod | peak CPU | peak memory | samples |"
            echo "|---|---|---|---|"
            if [ -s top-samples.txt ]; then
              awk '{ k = $2 "/" $3; c = $4; m = $5; sub(/m$/, "", c); sub(/Mi$/, "", m); n[k]++
                     if (c + 0 > cpu[k]) cpu[k] = c + 0; if (m + 0 > mem[k]) mem[k] = m + 0 }
                   END { for (k in n) printf "| %s | %d m | %d Mi | %d |\n", k, cpu[k], mem[k], n[k] }' top-samples.txt | sort
            else
              echo "| (no sample) | | | |"
            fi
            echo
            echo "| pod | restarts | terminated now | last termination |"
            echo "|---|---|---|---|"
            # A container killed seconds ago (OOMKilled during the race, run 41520333753) is still counted 0 restarts:
            # its current termination shows it.
            kubectl -n "$NS" get pods --no-headers \
              -o custom-columns='P:.metadata.name,R:.status.containerStatuses[*].restartCount,T:.status.containerStatuses[*].state.terminated.reason,L:.status.containerStatuses[*].lastState.terminated.reason' \
              2>/dev/null | awk '{ printf "| %s | %s | %s | %s |\n", $1, $2, ($3 == "<none>" ? "" : $3), ($4 == "<none>" ? "" : $4) }' || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gateway overhead under 15 ms at p95 (first byte and end, JSON and stream)
        if: always() && steps.relaysetup.outputs.inference == 'true'
        run: node scripts/relay-summary.ts --check inference-summary.json top-samples.txt phases.txt 2 > /dev/null
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get all,events -n "$NS" -o wide || true
          kubectl get events -n "$NS" --sort-by=.lastTimestamp | tail -80 || true
          for p in $(kubectl get pods -n "$NS" -o name); do
            echo "== $p"; kubectl logs -n "$NS" "$p" --all-containers --prefix --tail=200 || true
            # One container at a time: `--all-containers --previous` prints nothing when one of them has no previous
            # instance (the migrate init container never has one).
            for c in $(kubectl get -n "$NS" "$p" -o jsonpath='{.spec.containers[*].name}'); do
              kubectl logs -n "$NS" "$p" -c "$c" --prefix --previous --tail=100 2>/dev/null || true
            done
          done
          kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=100 || true
          kubectl -n kube-system get pods -o wide || true
          kubectl -n kube-system describe pods -l k8s-app=metrics-server | tail -40 || true
          kubectl -n kube-system logs -l k8s-app=metrics-server --tail=60 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chart-load-k6
          path: "*-summary.json\ntop-samples.txt\nphases.txt\nrunner-phases.txt"
          retention-days: 7
          if-no-files-found: ignore
