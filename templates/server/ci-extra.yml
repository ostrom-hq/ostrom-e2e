# Extra jobs for ostrom-server's .github/workflows/ci.yml, next to `coverage` and `native-tests` of
# templates/kotlin/ci.yml. Job names = required checks on main.
jobs:
  # The full-stack bench (ostrom-e2e) against THIS commit of the server, with the `ostrom` CLI from main.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: ostrom, POSTGRES_PASSWORD: ostrom, POSTGRES_DB: ostrom }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ostrom -d ostrom" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: This server, built and started
        id: server
        uses: ostrom-hq/ostrom-e2e/.github/actions/server@main
        with:
          path: .
          database-url: postgresql://ostrom:ostrom@localhost:5432/ostrom
      - name: ostrom CLI from main
        id: cli
        uses: ostrom-hq/ostrom-e2e/.github/actions/cli@main
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY_CLI }}
          required: "false" # flip to "true" once ostrom-cli meets the contract (QA does it)
      - uses: actions/checkout@v7
        with:
          repository: ostrom-hq/ostrom-e2e
          ssh-key: ${{ secrets.DEPLOY_KEY_E2E }}
          path: .ostrom/e2e
      - uses: pnpm/action-setup@v6
        with: { package_json_file: .ostrom/e2e/package.json }
      - uses: actions/setup-node@v7
        with: { node-version-file: .ostrom/e2e/.nvmrc }
      - name: Bench scenarios
        working-directory: .ostrom/e2e
        env:
          OSTROM_E2E_SERVER_URL: ${{ steps.server.outputs.url }}
          OSTROM_E2E_CLI_BIN: ${{ steps.cli.outputs.available == 'true' && steps.cli.outputs.bin || '' }}
        run: pnpm install --frozen-lockfile && pnpm e2e

  # Short k6 run on every PR (about 70 s) + the 100-simultaneous-yes race. Thresholds (p95/p99) fail the job.
  load-smoke:
    name: load-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: ostrom, POSTGRES_PASSWORD: ostrom, POSTGRES_DB: ostrom }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ostrom -d ostrom" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: This server, built and started
        id: server
        uses: ostrom-hq/ostrom-e2e/.github/actions/server@main
        with:
          path: .
          database-url: postgresql://ostrom:ostrom@localhost:5432/ostrom
      - uses: actions/checkout@v7
        with:
          repository: ostrom-hq/ostrom-e2e
          ssh-key: ${{ secrets.DEPLOY_KEY_E2E }}
          path: .ostrom/e2e
      - uses: grafana/setup-k6-action@v1
      - name: k6 smoke (p95/p99 thresholds)
        env: { OSTROM_URL: "${{ steps.server.outputs.url }}" }
        run: k6 run --summary-export smoke-summary.json .ostrom/e2e/load/smoke.js
      - name: k6 race (exactly one yes wins out of 100)
        env: { OSTROM_URL: "${{ steps.server.outputs.url }}" }
        run: k6 run --summary-export race-summary.json .ostrom/e2e/load/race.js
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: k6-smoke, path: "*-summary.json", if-no-files-found: ignore }
