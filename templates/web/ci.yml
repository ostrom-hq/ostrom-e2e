# CI of ostrom-web: ONE job `ci` on pull requests (the organisation's runners are scarce, JOURNAL 03:10), which is the
# required check on main. Types, lint, Vitest at 100 %, then Playwright against the REAL server and PostgreSQL.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["[0-9]*"]
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read

jobs:
  ci:
    name: ci
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm format:check
      - name: Unit and component tests, 100 % thresholds
        run: pnpm test:coverage
      - name: Real Ostrom server (built from ostrom-server main, cached by commit)
        id: server
        uses: ostrom-hq/ostrom-e2e/.github/actions/server@main
        with:
          deploy-key: ${{ secrets.DEPLOY_KEY_SERVER }}
          database-url: postgresql://localhost:5432/ostrom
          database-admin-url: postgresql://postgres:postgres@localhost:5432/postgres
          required: "false" # QA flips it to "true" once ostrom-server meets the bench contract
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        env:
          VITE_OSTROM_API_URL: ${{ steps.server.outputs.url }}
          OSTROM_URL: ${{ steps.server.outputs.url }}
          OSTROM_SERVER_AVAILABLE: ${{ steps.server.outputs.available }}
        run: pnpm build && pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: reports, path: "coverage/\nplaywright-report/", if-no-files-found: ignore }
