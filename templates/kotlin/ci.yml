# Test CI of an Ostrom Kotlin Multiplatform repository (ostrom-core, ostrom-cli, ostrom-server).
# Copy to .github/workflows/ci.yml (or merge its jobs into the existing workflow). The job `name:` values are the
# check names that the branch protection of `main` requires: do not rename them without updating the protection
# (ostrom-e2e/templates/README.md, « Noms des checks »).
#
# Rule (Lyes, 30/10/2026): unit + integration + e2e, 100 % lines and branches, all green, or the PR does not merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # Real PostgreSQL for the integration tests (service below). SQLite stays for local runs.
  OSTROM_TEST_DATABASE_URL: postgresql://ostrom:ostrom@localhost:5432/ostrom_test

jobs:
  # commonMain measured on the test-only jvm() target. Fails under 100 % of lines or branches.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ostrom
          POSTGRES_PASSWORD: ostrom
          POSTGRES_DB: ostrom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ostrom -d ostrom_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests on the JVM test target, Kover report and 100 % verification
        run: ./gradlew jvmTest koverXmlReport koverHtmlReport koverVerify --continue
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET
          rows = []
          for f in sorted(glob.glob("**/build/reports/kover/report.xml", recursive=True)):
              root = ET.parse(f).getroot()
              c = {e.get("type"): e for e in root.findall("counter")}
              def pct(t):
                  e = c.get(t)
                  if e is None: return "n/a"
                  m, k = int(e.get("missed")), int(e.get("covered"))
                  return f"{100.0 * k / (m + k):.2f} % ({k}/{m + k})" if m + k else "100.00 % (0/0)"
              rows.append(f"| `{os.path.dirname(os.path.dirname(os.path.dirname(os.path.dirname(f)))) or '.'}` | {pct('LINE')} | {pct('BRANCH')} |")
          out = "### Kover (jvm test target)\n\n| Module | Lines | Branches |\n|---|---|---|\n" + "\n".join(rows or ["| (no report) | | |"]) + "\n"
          print(out)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s: s.write(out)
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kover-report
          path: |
            **/build/reports/kover/
            **/build/reports/tests/
          if-no-files-found: ignore

  # The same tests compiled and run as Kotlin/Native (the product's real runtime).
  native-tests:
    name: native-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ostrom
          POSTGRES_PASSWORD: ostrom
          POSTGRES_DB: ostrom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ostrom -d ostrom_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      - name: linuxX64 tests
        run: ./gradlew linuxX64Test --continue
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
